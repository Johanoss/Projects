<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>School ID</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>
 
   <img src="pictures/bg.jfif" class="background-texture" alt="background-texture">
 
  <div class="id-card-container">
    
      <div class="id-card id-card-front">
   <div class="left">
    <img src="pictures/Agbulos.jfif" alt="Profile">
   </div>
   <div class="right">
    <img src="pictures/Logo.jpg" class="school-logo" alt="School Logo">
    <div class="name">JOM</div>
    <div class="fullname">Jonathan Mark V. Agbulos</div>
    <div class="course">BSIT</div>
    <div class="idnum">2024-140293</div>
            <div class="validity-row">
     <div class="valid-label">VALID FOR:</div>
     <div class="valid-date">2024-2026</div>
    </div>
   </div>
  </div>
    
    <div class="id-card id-card-back">
        
        <div class="signatures-row">
            <div class="signature-block student">
                <div class="signature-line"></div>
                <div class="signer-name placeholder-sig">JONATHAN MARK V. AGBULOS</div>
                <div class="signer-role">STUDENT</div>
            </div>

            <div class="signature-block registrar">
                <div class="signature-line"></div>
                <div class="signer-name placeholder-sig">KIMBERLY T. MALATE</div>
                <div class="signer-role">REGISTRAR</div>
            </div>
        </div>

        <div class="college-details">
            <p class="college-name">ASIA PACIFIC COLLEGE</p>
            <p class="college-info">
                3 Humabon Place, Magallanes, Makati City, 1232 PH<br>
                www.apc.edu.ph &nbsp; &nbsp; 8852 9232
            </p>
        </div>

        <img src="pictures/QR_code.png" class="qr-back" alt="QR Code">
        
        <div class="logo-text-group">
            <img src="pictures/Logo.jpg" class="apc-logo-back" alt="APC Logo">
            <div class="college-text-logo">ASIA PACIFIC COLLEGE</div>
        </div>
        
    </div>
    
  </div>
</body>

</html>
